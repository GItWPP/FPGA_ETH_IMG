name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-layout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'tools/requirements*.txt'
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Verify project and test pictures
        run: python tools/verify_repository.py
      - name: Python self-checks
        run: python tools/run_ci_checks.py
      - name: HDL layout checks
        run: python tools/check_rtl_style.py
      - name: Regenerate portable image vectors
        run: |
          python tools/generate_band_vectors.py
          python sim/generate_hog_vectors.py
          python sim/generate_eth_vectors.py
